<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký thành viên CLB Yêu Nhạc</title>
    <link href="DangKyThanhVien.css" rel="stylesheet" type="text/css">
</head>
<body>
    <form id="form1" name="form1" method="post" action="">
        <table width="500" border="1" cellpadding="4" cellspacing="0">
            <caption>ĐĂNG KÝ THÀNH VIÊN CLB YÊU NHẠC</caption>
            <tr>
                <td>Họ tên</td>
                <td><input type="text" id="txtHoTen" name="txtHoTen" class="mytextbox" placeholder="Nhập họ tên" required></td>
            </tr>
            <tr>
                <td>Tên đăng nhập</td>
                <td><input type="text" id="txtUserName" name="txtUserName" class="mytextbox" placeholder="Nhập tên đăng nhập" required></td>
            </tr>
            <tr>
                <td>Mật khẩu</td>
                <td><input type="password" id="txtPass" name="txtPass" class="mytextbox" placeholder="Nhập mật khẩu" required></td>
            </tr>
            <tr>
                <td>Gõ lại mật khẩu</td>
                <td><input type="password" id="txtRepass" name="txtRepass" class="mytextbox" placeholder="Nhập lại mật khẩu" required></td>
            </tr>
            <tr>
                <td>Giới tính</td>
                <td>
                    <input type="radio" id="rdNam" name="rdGioiTinh" value="0" checked> <label for="rdNam">Nam</label>
                    <input type="radio" id="rdNu" name="rdGioiTinh" value="1"> <label for="rdNu">Nữ</label>
                </td>
            </tr>
            <tr>
                <td>Ngoại ngữ</td>
                <td>
                    <input type="checkbox" id="chkAnh" name="chkAnh" value="Anh văn"> <label for="chkAnh">Anh văn</label>
                    <input type="checkbox" id="chkPhap" name="chkPhap" value="Pháp văn"> <label for="chkPhap">Pháp văn</label>
                    <input type="checkbox" id="chkHoa" name="chkHoa" value="Hoa văn"> <label for="chkHoa">Hoa văn</label>
                </td>
            </tr>
            <tr>
                <td>Nghề nghiệp</td>
                <td>
                    <select id="cboNgheNghiep" name="cboNgheNghiep" class="mytextbox">
                        <option value="0">Bạn làm nghề gì</option>
                        <option value="1">Học sinh - Sinh viên</option>
                        <option value="2">Giáo viên</option>
                        <option value="3">Nhân viên</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Hình</td>
                <td><input type="file" id="fHinh" name="fHinh" class="mytextbox"></td>
            </tr>
            <tr>
                <td>Sở thích</td>
<td><textarea id="txtSoThich" name="txtSoThich" class="mytextbox" rows="3"></textarea></td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <input type="submit" id="btnDangKy" name="btnDangKy" value="Đăng ký">
                    <input type="reset" id="btnXoa" name="btnXoa" value="Làm lại">
                    <input type="hidden" id="NgayDangKy" name="NgayDangKy" value="03/23/2023">
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
