<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Layout</title>
    <link rel="stylesheet" href="mainb1.css">
</head>
<body>

    <h2>PRODUCT NAME</h2>

    <div class="product">
        <div class="sale">-10%</div>

        <img src="product.png" class="product-img">

        <div class="bottom">
            <div class="price">
                <img src="dolar.png">
                <span>100</span>
            </div>

            <div class="icons">
                <img src="letter.png">
                <img src="favorites.png">
                <img src="add.png">
            </div>
        </div>
    </div>

</body>
</html>
