<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiểm tra sức khỏe BMI</title>
    <link rel="stylesheet" href="BMI.css">
</head>
<body>
    <div class="bmi-container">
        <div class="top-section">
            <div class="input-area">
                <div class="form-row">
                    <label for="weight">Cân nặng<br>(kg)</label>
                    <input type="number" id="weight" placeholder="Nhập cân nặng">
                </div>
                <div class="form-row">
                    <label for="height">Chiều cao<br>(cm)</label>
                    <input type="number" id="height" placeholder="Nhập chiều cao">
                </div>
            </div>
            <button type="button" id="btnCalc" onclick="tinhBMI()">Tính BMI</button>
        </div>

        <div id="result-box">
            Phần hiển thị kết quả chỉ số BMI
        </div>
    </div>

    <script src="BMI.js"></script>
</body>
</html>
