<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành thư viện SweetAlert2</title>
    <link rel="stylesheet" href="SweetAlert2.css">
    <!-- Nhúng thư viện SweetAlert2 theo hướng dẫn trong sách -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>
    <div class="container">
        <h2>Ví dụ thư viện SweetAlert2</h2>
        <div class="button-list">
            <button type="button" class="btn-success" onclick="fireSweetAlertSuccess()">1. Thông báo thành công</button>
            <button type="button" class="btn-info" onclick="fireSweetAlertInfo()">2. Thông báo thông tin</button>
            <button type="button" class="btn-error" onclick="fireSweetAlertError()">3. Thông báo lỗi</button>
            <button type="button" class="btn-top" onclick="showAlertTopEnd()">4. Hộp thoại góc trên phải</button>
            <button type="button" class="btn-confirm" onclick="showDialogWithPassingParams()">5. Hộp thoại xác nhận</button>
        </div>
    </div>

    <script src="SweetAlert2.js"></script>
</body>
</html>
